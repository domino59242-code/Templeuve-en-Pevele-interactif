<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Templeuve Interactive</title>

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin="">

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div id="application">

    <aside id="sidebar">

        <header>

            <h1>Templeuve Interactive</h1>

            <p class="version">
                Version 0.4
            </p>

        </header>

        <section>

            <label for="search">
                🔎 Rechercher
            </label>

            <input
                id="search"
                type="text"
                placeholder="Nom d'un lieu...">

        </section>

        <section>

            <label for="categorie">
                📂 Catégorie
            </label>

            <select id="categorie">

                <option value="Toutes">
                    Toutes les catégories
                </option>

            </select>

        </section>

        <section>

            <div id="compteur">

                0 lieu

            </div>

        </section>

        <section>

            <h2>Lieux</h2>

            <div id="listeLieux"></div>

        </section>

        <hr>

        <section>

            <h2>Détails</h2>

            <div id="ficheLieu">

                <p>Sélectionnez un lieu sur la carte ou dans la liste.</p>

            </div>

        </section>

    </aside>

    <main id="map"></main>

</div>

<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
crossorigin="">
</script>

<script src="js/app.js"></script>

</body>

</html>
